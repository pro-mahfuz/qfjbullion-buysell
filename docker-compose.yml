version: '3.9'

services:

  qfjbullion-buysell-app:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: qfjbullion-buysell

    volumes:
      - .:/var/www/html

    environment:
      APP_ENV: production
      DB_HOST: 72.61.114.40
      DB_PORT: 3306
      DB_DATABASE: db_qfjbullion_buy_sell
      DB_USERNAME: qfjbullion_user
      DB_PASSWORD: Mahfuz@5511

    expose:
      - 9000

    networks:
      - qfjbullion-buysell-app-network


  nginx:

    image: nginx:alpine

    container_name: qfjbullion_buysell_nginx

    volumes:
      - .:/var/www/html
      - ./nginx-qfjbullion-buysell.conf:/etc/nginx/conf.d/default.conf

    ports:
      - "9050:80"

    depends_on:
      - qfjbullion-buysell-app

    networks:
      - qfjbullion-buysell-app-network


networks:

  qfjbullion-buysell-app-network:
    driver: bridge