server {

    listen 80;
    server_name buysell.qfjbullion.com;

    root /var/www/html/public;
    index index.php index.html index.htm;

    # Pass HTTPS information from proxy/CDN to Laravel
    set_real_ip_from 0.0.0.0/0;

    location / {

        try_files $uri $uri/ /index.php?$query_string;

    }


    location ~ \.php$ {

        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass qfjbullion-buysell-app:9000;

        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Tell Laravel the original request was HTTPS
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_SSL on;

    }


    # Deny hidden files
    location ~ /\. {

        deny all;

    }


    # Cache static files
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf)$ {

        expires 30d;
        access_log off;

    }


    # Disable access to environment files
    location ~ /\.(env|git|htaccess|htpasswd) {

        deny all;

    }

}